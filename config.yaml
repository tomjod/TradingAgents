# Trading Bot Configuration

# Symbol to trade
symbol: "XAUUSDm"

# Timeframe (M1, M5, M15, M30, H1, H4, D1)
timeframe: "M5"

# Paths (Relative to Project Root)
model_path: "models/lightgbm_scalper_v4.txt" # V4 with regime & peak_hours features
bias_file: "bias.json"

# Trading Parameters
volume: 0.01
risk_percent: 0.01 # 0.5% risk per trade (smaller lots: 0.01-0.05)
sl_points: 800 # Optimizado: era 2000, reduce para mejor ratio R:R
tp_points: 500 # Not used (exit on signal change)
max_spread: 120 # Reducido de 180 -> evita mercados ilíquidos
cut_loss_points: 1500 # Reducido: era 5000, corta pérdidas antes

# Trailing Stop (ensure minimum profit)
trailing_stop_start: 350 # Start trailing after 100 points profit (~$0.10)
trailing_step: 100 # Move SL every 50 points
trailing_tp_distance: 500 # Keep TP this many points ahead of price

# Strategy
max_positions: 4 # Like reference bot (can hold 6 positions simultaneously)
interval_seconds: 180 # General Agent loop interval
trade_cooldown: 300 # Seconds to wait after opening a trade before opening another

# Trading Hours (UTC-3, Argentina time)
# Gold/XAU - mejores horas: London Open (8-10) y NY Overlap (13-16)
trading_hours:
  enabled: true
  start_hour: 8 # London Open
  end_hour: 18 # Extendido hasta cierre NY (era 13)
  trade_weekends: false # Don't trade on Saturday/Sunday

# Kill Switch Risk Management
kill_switch:
  enabled: false # SET TO true TO ACTIVATE
  daily_loss_limit: 0.02 # 2% max loss per day -> stop trading
  daily_profit_target: 0.03 # 3% daily profit -> stop trading (go to sleep!)
  max_drawdown: 0.05 # 5% from peak -> reduce lot 50%
  volatility_spread: 50 # Max spread to trade (points)
  lot_reduction: 0.5 # Reduce lot by 50% when in drawdown
  state_file: "risk_state.json"

# Tactical Agent (Fast BIAS - works WITH general.py in hybrid mode)
tactical_agent:
  enabled: true
  interval_seconds: 30 # Update BIAS every 30 seconds (vs 180 for general.py)
  strong_signal_threshold: 2.5 # Score threshold (era 5, muy alto para scores ponderados)
  use_mtf: true # Use Multi-Timeframe Analysis (M5, M15, H1)
  respect_ai_bias: true # HYBRID MODE: only update when aligned with AI agents
  ai_bias_stale_minutes: 10 # Override AI bias if older than this

